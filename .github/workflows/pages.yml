name: Build and publish the demo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Builds the demo with the master of core and extras, checks every page and uploads the site
    uses: gwtbootstrap5/gwtbootstrap5-parent/.github/workflows/build.yml@master
    with:
      pages: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
